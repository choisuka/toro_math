<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦕 토로매쓰 — 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1923;color:#f0f4f8;font-family:'Nanum Gothic',sans-serif;min-height:100vh;padding:24px}
.wrap{max-width:640px;margin:0 auto}
h1{font-family:'Jua',sans-serif;color:#2ecc71;font-size:1.4rem;margin-bottom:20px}

/* 로그인 폼 */
#login-box{background:#1a2a3a;border-radius:20px;padding:32px 26px;max-width:380px;margin:60px auto 0}
#login-box label{display:block;font-size:.82rem;color:#8899aa;margin:14px 0 6px}
#login-box input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid #334;background:#162030;color:#f0f4f8;font-size:.95rem}
#login-box button{width:100%;margin-top:20px;padding:12px;border:none;border-radius:14px;background:linear-gradient(135deg,#1a5c2a,#2ecc71);color:#fff;font-family:'Jua',sans-serif;font-size:1rem;cursor:pointer}

/* 목록 */
#panel{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.topbar button{background:#162030;color:#f0f4f8;border:1px solid #334;border-radius:10px;padding:8px 14px;font-size:.85rem;cursor:pointer}
.card{background:#1a2a3a;border-radius:16px;padding:16px 18px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card .info{flex:1;min-width:180px}
.card .email{font-weight:700}
.card .meta{font-size:.78rem;color:#8899aa;margin-top:3px}
.card select{padding:8px 10px;border-radius:10px;border:1px solid #334;background:#162030;color:#f0f4f8;font-size:.85rem}
.card .btn{border:none;border-radius:10px;padding:9px 14px;font-family:'Jua',sans-serif;font-size:.85rem;cursor:pointer}
.btn-approve{background:linear-gradient(135deg,#1a5c2a,#2ecc71);color:#fff}
.btn-reject{background:#3a1a1a;color:#f0a0a0;border:1px solid #5a2a2a}
.empty{color:#8899aa;text-align:center;padding:40px 0}
.msg{font-size:.85rem;margin-bottom:10px;min-height:1.2em}
.msg.err{color:#e74c3c}
</style>
</head>
<body>
<div class="wrap">
  <h1>🦕 토로매쓰 관리자</h1>

  <div id="login-box">
    <div class="msg" id="login-msg"></div>
    <label for="admin-email">이메일</label>
    <input id="admin-email" type="email" autocomplete="email">
    <label for="admin-password">비밀번호</label>
    <input id="admin-password" type="password" autocomplete="current-password">
    <button id="admin-login-btn">로그인</button>
  </div>

  <div id="panel">
    <div class="topbar">
      <div>승인 대기: <span id="pending-count">0</span>명</div>
      <button id="logout-btn">로그아웃</button>
    </div>
    <div id="msg" class="msg"></div>
    <div id="list"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
firebase.initializeApp(window.FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();

const GRADE_LABEL = {
  "grade-mid1": "중1", "grade-mid2": "중2", "grade-mid3": "중3",
  "grade-gs1": "공통수학1", "grade-gs2": "공통수학2",
};

const loginBox = document.getElementById("login-box");
const panel = document.getElementById("panel");
const loginMsg = document.getElementById("login-msg");
const msg = document.getElementById("msg");
const list = document.getElementById("list");
const pendingCount = document.getElementById("pending-count");

document.getElementById("admin-login-btn").addEventListener("click", async () => {
  loginMsg.className = "msg err";
  loginMsg.textContent = "";
  const email = document.getElementById("admin-email").value.trim();
  const password = document.getElementById("admin-password").value;
  try {
    await auth.signInWithEmailAndPassword(email, password);
  } catch (err) {
    loginMsg.textContent = "로그인 실패: " + (err.message || err.code);
  }
});

document.getElementById("logout-btn").addEventListener("click", () => auth.signOut());

auth.onAuthStateChanged((user) => {
  if (user && user.email === window.ADMIN_EMAIL) {
    loginBox.style.display = "none";
    panel.style.display = "block";
    subscribePending();
  } else {
    loginBox.style.display = "block";
    panel.style.display = "none";
    if (user) {
      loginMsg.className = "msg err";
      loginMsg.textContent = "관리자 계정이 아니에요.";
      auth.signOut();
    }
  }
});

function subscribePending() {
  db.collection("users").where("approved", "==", false)
    .onSnapshot((snap) => {
      pendingCount.textContent = snap.size;
      if (snap.empty) {
        list.innerHTML = '<div class="empty">대기중인 신청이 없어요.</div>';
        return;
      }
      list.innerHTML = "";
      snap.forEach((doc) => {
        const data = doc.data();
        const uid = doc.id;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="info">
            <div class="email">${escapeHtml(data.email || "(이메일 없음)")}</div>
            <div class="meta">신청 학년: ${GRADE_LABEL[data.grade] || data.grade || "-"}</div>
          </div>
          <select data-uid="${uid}" class="grade-select">
            ${Object.entries(GRADE_LABEL).map(([v, l]) =>
              `<option value="${v}" ${v === data.grade ? "selected" : ""}>${l}</option>`).join("")}
          </select>
          <button class="btn btn-approve" data-uid="${uid}" data-action="approve">승인</button>
          <button class="btn btn-reject" data-uid="${uid}" data-action="reject">거절</button>
        `;
        list.appendChild(card);
      });
    }, (err) => {
      msg.className = "msg err";
      msg.textContent = "목록을 불러오지 못했어요: " + err.message;
    });
}

list.addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-action]");
  if (!btn) return;
  const uid = btn.dataset.uid;
  const action = btn.dataset.action;
  const select = list.querySelector(`select[data-uid="${uid}"]`);
  const grade = select ? select.value : null;

  btn.disabled = true;
  msg.className = "msg";
  msg.textContent = "처리중...";

  try {
    const idToken = await auth.currentUser.getIdToken();
    const res = await fetch("/.netlify/functions/approve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ idToken, targetUid: uid, grade, action }),
    });
    if (!res.ok) throw new Error(await res.text());
    msg.textContent = action === "approve" ? "승인 완료" : "거절(삭제) 완료";
  } catch (err) {
    msg.className = "msg err";
    msg.textContent = "처리 실패: " + err.message;
    btn.disabled = false;
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
</script>
</body>
</html>
