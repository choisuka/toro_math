<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>≅ 기본도형 — 합동조건 판별</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--card:#111827;
  --text:#e2e8f0;--muted:#64748b;--border:rgba(255,255,255,.08);
  --good:#34d399;--bad:#f87171}
body{font-family:"Nanum Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:520px;margin:0 auto;padding:1.25rem 1.1rem 3rem}

.nav-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem}
.back-link{font-family:'Jua',sans-serif;font-size:.82rem;color:var(--muted);text-decoration:none;
  background:rgba(255,255,255,.08);padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.15)}
.progress-pill{font-family:'Jua',sans-serif;font-size:.78rem;color:#c4b5fd;background:rgba(168,85,247,.12);
  border:1px solid rgba(168,85,247,.3);padding:5px 12px;border-radius:20px}

.sec-head{text-align:center;margin-bottom:1.3rem}
.sec-head h1{font-family:'Jua',sans-serif;font-size:1.5rem;margin-bottom:.35rem;
  background:linear-gradient(135deg,#c4b5fd,#f0abfc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sec-head p{color:var(--muted);font-size:.82rem;line-height:1.6}

.score-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:.7rem 1rem}
.score-item{text-align:center}
.score-item .num{font-family:'Jua',sans-serif;font-size:1.1rem;color:#fff}
.score-item .lbl{font-size:.68rem;color:var(--muted)}
.streak-fire{color:#fb923c}

.progress-track{height:6px;background:rgba(255,255,255,.08);border-radius:4px;margin-bottom:1.2rem;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#a855f7,#e879f9);border-radius:4px;transition:width .3s}

.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:1.5rem 1.3rem;margin-bottom:1.2rem}
.quiz-topic{display:inline-block;font-size:.7rem;color:#c4b5fd;background:rgba(168,85,247,.12);
  border:1px solid rgba(168,85,247,.3);padding:.25rem .65rem;border-radius:10px;margin-bottom:.9rem}
.quiz-prompt{font-size:.72rem;color:var(--muted);margin-bottom:.5rem}
.quiz-sentence{font-size:1.02rem;font-weight:800;line-height:1.65;color:#fff;margin-bottom:1.3rem}

.choices{display:flex;flex-direction:column;gap:.6rem}
.choice-btn{display:flex;align-items:center;gap:.6rem;text-align:left;width:100%;
  background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:14px;
  padding:.75rem .9rem;color:var(--text);font-size:.88rem;font-family:inherit;cursor:pointer;
  transition:border-color .15s,background .15s}
.choice-btn:hover:not(:disabled){border-color:rgba(168,85,247,.5);background:rgba(168,85,247,.08)}
.choice-btn:disabled{cursor:default}
.choice-num{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:var(--muted)}
.choice-btn.correct{border-color:var(--good);background:rgba(52,211,153,.12)}
.choice-btn.correct .choice-num{background:var(--good);color:#052e1c}
.choice-btn.wrong{border-color:var(--bad);background:rgba(248,113,113,.12)}
.choice-btn.wrong .choice-num{background:var(--bad);color:#3a0a0a}
.choice-btn.selected{border-color:rgba(168,85,247,.8);background:rgba(168,85,247,.16)}
.choice-btn.selected .choice-num{background:rgba(168,85,247,.8);color:#1e1033}
.submit-btn{display:none;width:100%;margin-top:1rem;padding:.85rem;border:none;border-radius:14px;
  background:linear-gradient(135deg,#a855f7,#e879f9);color:#fff;font-family:'Jua',sans-serif;
  font-size:.92rem;cursor:pointer;opacity:.4;pointer-events:none}
.submit-btn.show{display:block}
.submit-btn.ready{opacity:1;pointer-events:auto}

.explain-box{margin-top:1.1rem;padding:1rem 1.1rem;border-radius:14px;font-size:.85rem;line-height:1.7;display:none}
.explain-box.show{display:block}
.explain-box.good{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3);color:#a7f3d0}
.explain-box.bad{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);color:#fecaca}
.explain-box .verdict{font-family:'Jua',sans-serif;font-size:.92rem;margin-bottom:.4rem}

.next-btn{display:block;width:100%;margin-top:1rem;padding:.85rem;border:none;border-radius:14px;
  background:linear-gradient(135deg,#a855f7,#e879f9);color:#fff;font-family:'Jua',sans-serif;
  font-size:.92rem;cursor:pointer;display:none}
.next-btn.show{display:block}

.end-screen{display:none;text-align:center;background:var(--card);border:1px solid var(--border);
  border-radius:22px;padding:2.4rem 1.6rem}
.end-screen.show{display:block}
.end-icon{font-size:3.2rem;margin-bottom:.8rem}
.end-title{font-family:'Jua',sans-serif;font-size:1.3rem;margin-bottom:.5rem}
.end-score{font-family:'Jua',sans-serif;font-size:2.2rem;background:linear-gradient(135deg,#c4b5fd,#f0abfc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem}
.end-desc{color:var(--muted);font-size:.85rem;margin-bottom:1.4rem;line-height:1.6}
.retry-btn{display:inline-block;padding:.8rem 1.8rem;border:none;border-radius:14px;
  background:linear-gradient(135deg,#a855f7,#e879f9);color:#fff;font-family:'Jua',sans-serif;
  font-size:.88rem;cursor:pointer}
</style>
</head>
<body>
<div class="container">

  <div class="nav-bar">
    <a href="../games_mid_geo13.html" class="back-link">← 중1기하</a>
    <span class="progress-pill" id="progPill">1 / 10</span>
  </div>

  <div class="sec-head">
    <h1>≅ 합동조건 판별</h1>
    <p>기본도형 — SSS·SAS·ASA, 어떤 조건이 쓰였는지 정확히 판별하세요.</p>
  </div>

  <div class="score-bar">
    <div class="score-item"><div class="num" id="scoreNum">0</div><div class="lbl">정답</div></div>
    <div class="score-item"><div class="num streak-fire" id="streakNum">0🔥</div><div class="lbl">연속정답</div></div>
    <div class="score-item"><div class="num" id="totalNum">0 / 10</div><div class="lbl">진행</div></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progFill" style="width:0%"></div></div>

  <div class="quiz-card" id="quizCard">
    <div class="quiz-topic" id="quizTopic">단원</div>
    <div class="quiz-prompt">📖 문장을 보고 알맞은 합동조건을 고르세요</div>
    <div class="quiz-sentence" id="quizSentence">문장</div>
    <div class="choices" id="choices"></div>
    <div class="explain-box" id="explainBox">
      <div class="verdict" id="explainVerdict"></div>
      <div id="explainText"></div>
    </div>
    <button class="submit-btn" id="submitBtn">제출하기 ✓</button>
    <button class="next-btn" id="nextBtn">다음 문제 →</button>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="end-icon">🏆</div>
    <div class="end-title">완료!</div>
    <div class="end-score" id="endScore">0 / 10</div>
    <div class="end-desc" id="endDesc">"끼인각"·"끼인변"이라는 단어에 집중하는 습관이 합동조건 판별의 핵심이에요.</div>
    <button class="retry-btn" onclick="restart()">🔄 다시 도전</button>
  </div>

</div>

<script>
const QUESTIONS = [
{
  topic: '합동조건 — SSS',
  sentence: '두 삼각형에서 대응하는 세 변의 길이가 각각 같다. 어떤 합동조건인가?',
  choices: ['SSS', 'SAS', 'ASA', '합동이 아니다'],
  answer: 0,
  why: '변-변-변, 즉 세 변의 길이가 모두 같으면 SSS 합동이에요.'
},
{
  topic: '합동조건 — SAS',
  sentence: '대응하는 두 변의 길이와 그 끼인각이 각각 같다. 어떤 합동조건인가?',
  choices: ['SAS', 'SSS', 'ASA', '합동이 아니다'],
  answer: 0,
  why: '변-끼인각-변, 즉 두 변과 그 사이의 각이 같으면 SAS 합동이에요.'
},
{
  topic: '합동조건 — ASA',
  sentence: '대응하는 두 각의 크기와 그 끼인변의 길이가 각각 같다. 어떤 합동조건인가?',
  choices: ['ASA', 'SSS', 'SAS', '합동이 아니다'],
  answer: 0,
  why: '각-끼인변-각, 즉 두 각과 그 사이의 변이 같으면 ASA 합동이에요.'
},
{
  topic: '함정 — 끼인각이 아니면',
  sentence: '두 변의 길이와, 그 끼인각이 아닌 다른 한 각이 각각 같다(SSA). 이것만으로 합동을 확정할 수 있을까?',
  choices: ['확정할 수 없다', 'SAS와 같은 조건이라 확정된다', 'SSS와 같은 조건이라 확정된다', '항상 두 삼각형이 합동이다'],
  answer: 0,
  why: '끼인각이 아닌 각이 같은 조건(SSA)은 삼각형이 두 가지 다른 모양으로 그려질 수 있어서 합동을 확정할 수 없어요. 반드시 끼인각이어야 SAS가 성립해요.'
},
{
  topic: '삼각형 속 조건 판별 ①',
  sentence: '삼각형 ABC와 DEF에서 AB=DE, BC=EF, ∠B=∠E일 때 사용된 합동조건은?',
  choices: ['SAS (∠B가 AB, BC의 끼인각)', 'SSS', 'ASA', '조건 부족'],
  answer: 0,
  why: '∠B는 AB와 BC가 만나서 만드는 끼인각이에요. 변-끼인각-변 순서이므로 SAS예요.'
},
{
  topic: '삼각형 속 조건 판별 ②',
  sentence: '삼각형 ABC와 DEF에서 AB=DE, ∠A=∠D, ∠B=∠E일 때 사용된 합동조건은?',
  choices: ['ASA (AB가 ∠A, ∠B의 끼인변)', 'SAS', 'SSS', '조건 부족'],
  answer: 0,
  why: 'AB는 ∠A와 ∠B 사이에 있는 끼인변이에요. 각-끼인변-각 순서이므로 ASA예요.'
},
{
  topic: 'AAA는 합동조건이 아니다',
  sentence: '두 삼각형의 대응하는 세 각의 크기가 모두 같다(AAA). 두 삼각형은 합동일까?',
  choices: ['아니다 — 모양은 같아도 크기가 다를 수 있다(닮음)', '맞다 — SSS와 동급이다', '맞다 — 항상 합동이다', '알 수 없다'],
  answer: 0,
  why: '세 각이 같아도 크기(변의 길이)는 다를 수 있어요. 이건 합동이 아니라 닮음이라는 별개의 개념이에요.'
},
{
  topic: '합동조건 종합 판별 (AAS)',
  sentence: '두 삼각형에서 한 변의 길이와, 그 양 끝이 아닌 두 각이 각각 같다. 합동이라고 확정할 수 있을까?',
  choices: ['확정할 수 있다 — 나머지 한 각도 내각의 합으로 자동 결정되어 ASA로 연결된다', '확정할 수 없다', 'SSS 조건이 추가로 필요하다', 'SAS 조건이 추가로 필요하다'],
  answer: 0,
  why: '두 각을 알면 삼각형 내각의 합(180°)으로 나머지 한 각도 자동으로 정해져요. 그러면 그 변이 자연히 두 각의 끼인변이 되어 ASA로 연결돼서 합동이 확정돼요.'
},
{
  topic: 'SSA — 두 변과 끼인각이 아닌 한 각',
  sentence: '두 변의 길이와, 그 끼인각이 아닌 다른 한 각이 주어지면 삼각형은 몇 개 만들어지는가?',
  choices: ['조건에 따라 0개, 1개, 또는 2개가 될 수 있다(정해지지 않음)', '항상 1개로 정해진다', '항상 2개가 만들어진다', '항상 0개, 즉 삼각형이 그려지지 않는다'],
  answer: 0,
  why: '<svg viewBox="0 0 220 170" style="display:block;margin:8px auto;max-width:220px" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="170" fill="#0d1a28" rx="8"/><line x1="30" y1="150" x2="220" y2="150" stroke="#93c5fd" stroke-width="2"/><line x1="30" y1="150" x2="190.9" y2="15" stroke="#93c5fd" stroke-width="2"/><circle cx="170" cy="150" r="110" fill="none" stroke="#f9a8d4" stroke-width="1.5" stroke-dasharray="4,3"/><line x1="170" y1="150" x2="63.7" y2="121.7" stroke="#fbbf24" stroke-width="2"/><line x1="170" y1="150" x2="160.6" y2="40.4" stroke="#fbbf24" stroke-width="2"/><circle cx="30" cy="150" r="2.5" fill="#e2e8f0"/><circle cx="170" cy="150" r="2.5" fill="#e2e8f0"/><circle cx="63.7" cy="121.7" r="2.5" fill="#e2e8f0"/><circle cx="160.6" cy="40.4" r="2.5" fill="#e2e8f0"/><text x="16" y="166" fill="#e2e8f0" font-size="11">A</text><text x="176" y="166" fill="#e2e8f0" font-size="11">B</text><text x="34" y="120" fill="#e2e8f0" font-size="11">C₁</text><text x="164" y="36" fill="#e2e8f0" font-size="11">C₂</text></svg>같은 각 A, 같은 변 AB, 같은 변 길이(분홍 원의 반지름)인데도 B에서 그 길이만큼 컴퍼스를 돌리면(분홍 원) 반대편 변과 <b style="color:#fbbf24">두 지점(C₁, C₂)</b>에서 만나요 — 삼각형 ABC₁과 ABC₂, 완전히 다른 두 삼각형이 같은 조건에서 나와요. 조건에 따라 원이 그 변에 안 닿으면(0개) 또는 딱 한 점에서 스치면(1개, 직각인 경우)도 있어서, SSA는 개수가 정해지지 않아 합동조건이 될 수 없어요.'
},
{
  topic: '한 변과 두 각',
  sentence: '한 변의 길이와 두 각의 크기가 주어지면(끼인변이든 아니든) 삼각형은 몇 개 만들어지는가?',
  choices: ['항상 1개로 정해진다', '조건에 따라 0개, 1개, 또는 2개가 될 수 있다', '항상 2개가 만들어진다', '변이 끼인변일 때만 1개, 아니면 정해지지 않는다'],
  answer: 0,
  why: '<svg viewBox="0 0 220 170" style="display:block;margin:8px auto;max-width:220px" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="170" fill="#0d1a28" rx="8"/><polygon points="40,140 180,140 110,30" fill="none" stroke="#86efac" stroke-width="2"/><line x1="40" y1="140" x2="180" y2="140" stroke="#fde68a" stroke-width="3"/><circle cx="40" cy="140" r="2.5" fill="#e2e8f0"/><circle cx="180" cy="140" r="2.5" fill="#e2e8f0"/><circle cx="110" cy="30" r="2.5" fill="#e2e8f0"/><text x="26" y="156" fill="#e2e8f0" font-size="11">A</text><text x="184" y="156" fill="#e2e8f0" font-size="11">B</text><text x="106" y="22" fill="#e2e8f0" font-size="11">C</text><text x="50" y="132" fill="#f87171" font-size="11">∠A</text><text x="155" y="132" fill="#93c5fd" font-size="11">∠B</text><text x="70" y="164" fill="#fde68a" font-size="10">이 변 AB (끼인변, ASA)</text></svg>∠A, ∠B를 알면 ∠C=180°−∠A−∠B로 자동 결정돼서 삼각형의 <b style="color:#86efac">모양</b>이 완전히 고정돼요. 그림처럼 변 AB(끼인변, ASA)를 주면 크기까지 고정되는데, 만약 대신 변 BC(끼인변이 아닌 변, AAS)를 줬어도 마찬가지로 모양은 이미 고정된 상태라 크기도 똑같이 하나로 정해져요 — 그래서 ASA와 AAS는 결론이 같은 동치 조건이에요.'
}
];

let order = [], idx = 0, score = 0, streak = 0, answered = false;
let selectedSet = new Set();

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function restart(){
  order = shuffle(QUESTIONS.map((_,i)=>i));
  idx = 0; score = 0; streak = 0;
  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('quizCard').style.display = 'block';
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  selectedSet = new Set();
  const q = QUESTIONS[order[idx]];
  const isMulti = Array.isArray(q.answer);
  document.getElementById('quizTopic').textContent = q.topic;
  document.getElementById('quizSentence').textContent = q.sentence + (isMulti ? ' (모두 고르시오)' : '');
  document.getElementById('progPill').textContent = (idx+1)+' / '+QUESTIONS.length;
  document.getElementById('totalNum').textContent = idx+' / '+QUESTIONS.length;
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('streakNum').textContent = streak+'🔥';
  document.getElementById('progFill').style.width = (idx/QUESTIONS.length*100)+'%';

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  const shuffledChoiceIdx = shuffle(q.choices.map((_,i)=>i));
  shuffledChoiceIdx.forEach((origIdx, pos)=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.dataset.idx = origIdx;
    btn.innerHTML = '<span class="choice-num">'+(pos+1)+'</span><span>'+q.choices[origIdx]+'</span>';
    btn.onclick = isMulti ? (()=> toggleChoice(origIdx, btn)) : (()=> selectChoice(origIdx, btn));
    choicesEl.appendChild(btn);
  });

  document.getElementById('explainBox').className = 'explain-box';
  document.getElementById('nextBtn').className = 'next-btn';
  document.getElementById('submitBtn').className = 'submit-btn' + (isMulti ? ' show' : '');
}

function selectChoice(origIdx, btnEl){
  if(answered) return;
  answered = true;
  const q = QUESTIONS[order[idx]];
  const allBtns = document.querySelectorAll('.choice-btn');
  allBtns.forEach(b=> b.disabled = true);

  const isCorrect = origIdx === q.answer;
  if(isCorrect){
    btnEl.classList.add('correct');
    score++; streak++;
  } else {
    btnEl.classList.add('wrong');
    allBtns.forEach(b=>{
      if(Number(b.dataset.idx) === q.answer) b.classList.add('correct');
    });
    streak = 0;
  }
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('streakNum').textContent = streak+'🔥';

  const box = document.getElementById('explainBox');
  box.className = 'explain-box show ' + (isCorrect ? 'good' : 'bad');
  document.getElementById('explainVerdict').textContent = isCorrect ? '✅ 맞아요!' : '❌ 아쉬워요 — 정답: '+q.choices[q.answer];
  document.getElementById('explainText').innerHTML = q.why;

  document.getElementById('nextBtn').className = 'next-btn show';
}

function toggleChoice(origIdx, btnEl){
  if(answered) return;
  if(selectedSet.has(origIdx)){
    selectedSet.delete(origIdx);
    btnEl.classList.remove('selected');
  } else {
    selectedSet.add(origIdx);
    btnEl.classList.add('selected');
  }
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.classList.toggle('ready', selectedSet.size > 0);
}

function submitMulti(){
  if(answered) return;
  if(selectedSet.size === 0) return;
  answered = true;
  const q = QUESTIONS[order[idx]];
  const answerSet = new Set(q.answer);
  const allBtns = document.querySelectorAll('.choice-btn');
  allBtns.forEach(b=> b.disabled = true);

  const isCorrect = selectedSet.size === answerSet.size && [...selectedSet].every(i=> answerSet.has(i));

  allBtns.forEach(b=>{
    const oi = Number(b.dataset.idx);
    if(answerSet.has(oi)) b.classList.add('correct');
    else if(selectedSet.has(oi)) b.classList.add('wrong');
  });

  if(isCorrect){ score++; streak++; } else { streak = 0; }
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('streakNum').textContent = streak+'🔥';

  const correctList = q.answer.map(i=> q.choices[i]).join(' + ');
  const box = document.getElementById('explainBox');
  box.className = 'explain-box show ' + (isCorrect ? 'good' : 'bad');
  document.getElementById('explainVerdict').textContent = isCorrect ? '✅ 맞아요!' : '❌ 아쉬워요 — 정답: '+correctList;
  document.getElementById('explainText').innerHTML = q.why;

  document.getElementById('submitBtn').className = 'submit-btn';
  document.getElementById('nextBtn').className = 'next-btn show';
}

document.getElementById('submitBtn').onclick = submitMulti;

document.getElementById('nextBtn').onclick = ()=>{
  idx++;
  if(idx >= QUESTIONS.length){
    document.getElementById('quizCard').style.display = 'none';
    document.getElementById('endScreen').classList.add('show');
    document.getElementById('endScore').textContent = score+' / '+QUESTIONS.length;
    document.getElementById('progFill').style.width = '100%';
    document.getElementById('totalNum').textContent = QUESTIONS.length+' / '+QUESTIONS.length;
    document.getElementById('progPill').textContent = QUESTIONS.length+' / '+QUESTIONS.length;
  } else {
    renderQuestion();
  }
};

restart();
</script>
