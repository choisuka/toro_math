<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💰 연립방정식의 활용 — 원가정가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0e1a;--card:#111827;
  --text:#e2e8f0;--muted:#64748b;--border:rgba(255,255,255,.08);
  --good:#34d399;--bad:#f87171}
body{font-family:"Nanum Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.container{max-width:520px;margin:0 auto;padding:1.25rem 1.1rem 3rem}


.nav-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem;gap:8px}
.progress-pill{font-family:'Jua',sans-serif;font-size:.78rem;color:#7dd3fc;background:rgba(14,165,233,.12);
  border:1px solid rgba(14,165,233,.3);padding:5px 12px;border-radius:20px}
.nav-back{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#ccc;border-radius:8px;
  padding:6px 12px;font-family:'Jua',sans-serif;font-size:.76rem;cursor:pointer}
.nav-right{display:flex;align-items:center;gap:8px}
.print-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#aaa;border-radius:8px;
  padding:4px 9px;font-size:.85rem;cursor:pointer}

.sec-head{text-align:center;margin-bottom:1.3rem}
.sec-head h1{font-family:'Jua',sans-serif;font-size:1.4rem;margin-bottom:.35rem;
  background:linear-gradient(135deg,#38bdf8,#2dd4bf);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sec-head p{color:var(--muted);font-size:.82rem;line-height:1.6}

.score-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;
  background:var(--card);border:1px solid var(--border);border-radius:14px;padding:.7rem 1rem}
.score-item{text-align:center}
.score-item .num{font-family:'Jua',sans-serif;font-size:1.1rem;color:#fff}
.score-item .lbl{font-size:.68rem;color:var(--muted)}
.streak-fire{color:#fb923c}

.progress-track{height:6px;background:rgba(255,255,255,.08);border-radius:4px;margin-bottom:1.2rem;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#0ea5e9,#14b8a6);border-radius:4px;transition:width .3s}

.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:1.5rem 1.3rem;margin-bottom:1.2rem}
.quiz-topic{display:inline-block;font-size:.7rem;color:#7dd3fc;background:rgba(14,165,233,.12);
  border:1px solid rgba(14,165,233,.3);padding:.25rem .65rem;border-radius:10px;margin-bottom:.6rem}
.quiz-source{font-size:1rem;font-weight:800;color:#fff;margin-bottom:1rem;line-height:1.65;
  background:rgba(255,255,255,.03);border-radius:10px;padding:.85rem .9rem}
.quiz-source b{color:#fde68a}
.quiz-prompt{font-size:.72rem;color:var(--muted);margin-bottom:.5rem}
.quiz-sentence{font-size:1rem;font-weight:800;line-height:1.65;color:#fff;margin-bottom:1.3rem}

.choices{display:flex;flex-direction:column;gap:.6rem}
.choice-btn{display:flex;align-items:flex-start;gap:.6rem;text-align:left;width:100%;
  background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:14px;
  padding:.75rem .9rem;color:var(--text);font-size:.86rem;font-family:inherit;cursor:pointer;
  transition:border-color .15s,background .15s}
.choice-btn:hover:not(:disabled){border-color:rgba(14,165,233,.5);background:rgba(14,165,233,.08)}
.choice-btn:disabled{cursor:default}
.choice-num{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:var(--muted);margin-top:.1rem}
.choice-btn.correct{border-color:var(--good);background:rgba(52,211,153,.12)}
.choice-btn.correct .choice-num{background:var(--good);color:#052e1c}
.choice-btn.wrong{border-color:var(--bad);background:rgba(248,113,113,.12)}
.choice-btn.wrong .choice-num{background:var(--bad);color:#3a0a0a}

.explain-box{margin-top:1.1rem;padding:1rem 1.1rem;border-radius:14px;font-size:.85rem;line-height:1.7;display:none}
.explain-box.show{display:block}
.explain-box.good{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3);color:#a7f3d0}
.explain-box.bad{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);color:#fecaca}
.explain-box .verdict{font-family:'Jua',sans-serif;font-size:.92rem;margin-bottom:.4rem}

.qnav{display:flex;gap:8px;margin-top:1rem}
.qnav-prev{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#ccc;
  border-radius:14px;padding:.85rem;font-family:'Jua',sans-serif;font-size:.86rem;cursor:pointer}
.qnav-prev:disabled{opacity:.35;cursor:default}
.qnav-skip{flex:0 0 auto;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#888;
  border-radius:14px;padding:.85rem 1rem;font-family:'Jua',sans-serif;font-size:.8rem;cursor:pointer}
.qnav-next{flex:1;background:linear-gradient(135deg,#0ea5e9,#14b8a6);border:none;color:#fff;
  border-radius:14px;padding:.85rem;font-family:'Jua',sans-serif;font-size:.86rem;cursor:pointer}
.qnav-next:disabled{opacity:.35;cursor:default;background:rgba(255,255,255,.08);color:#666}

.end-screen{display:none;text-align:center;background:var(--card);border:1px solid var(--border);
  border-radius:22px;padding:2.4rem 1.6rem}
.end-screen.show{display:block}
.end-icon{font-size:3.2rem;margin-bottom:.8rem}
.end-title{font-family:'Jua',sans-serif;font-size:1.3rem;margin-bottom:.5rem}
.end-score{font-family:'Jua',sans-serif;font-size:2.2rem;background:linear-gradient(135deg,#38bdf8,#2dd4bf);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.3rem}
.end-desc{color:var(--muted);font-size:.85rem;margin-bottom:1.4rem;line-height:1.6}
.retry-btn{display:inline-block;padding:.8rem 1.8rem;border:none;border-radius:14px;
  background:linear-gradient(135deg,#0ea5e9,#14b8a6);color:#fff;font-family:'Jua',sans-serif;
  font-size:.88rem;cursor:pointer}
</style>
</head>
<body>
<div class="container">

  <div class="nav-bar">
    <button class="nav-back" onclick="history.back()">← 뒤로</button>
    <div class="nav-right">
      <button class="print-btn" onclick="printQuestions()" title="전체 인쇄">🖨️</button>
      <span class="progress-pill" id="progPill">1 / 13</span>
    </div>
  </div>

  <div class="sec-head">
    <h1>💰 연립방정식의 활용 — 원가정가</h1>
    <p><b style="color:#e2e8f0">미지수 두 개</b>로 풀리는 원가·정가 문제 — 두 제품의 조건을 각각 식으로 세워요.</p>
  </div>

  <div class="score-bar">
    <div class="score-item"><div class="num" id="scoreNum">0</div><div class="lbl">정답</div></div>
    <div class="score-item"><div class="num streak-fire" id="streakNum">0🔥</div><div class="lbl">연속정답</div></div>
    <div class="score-item"><div class="num" id="totalNum">0 / 13</div><div class="lbl">진행</div></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progFill" style="width:0%"></div></div>

  <div class="quiz-card" id="quizCard">
    <div class="quiz-topic" id="quizTopic">단계</div>
    <div class="quiz-source" id="quizSource">문제</div>
    <div class="quiz-prompt">📖 이 단계에서 필요한 것은?</div>
    <div class="quiz-sentence" id="quizSentence">문장</div>
    <div class="choices" id="choices"></div>
    <div class="explain-box" id="explainBox">
      <div class="verdict" id="explainVerdict"></div>
      <div id="explainText"></div>
    </div>
    <div class="qnav">
      <button class="qnav-prev" id="prevBtn">← 이전</button>
      <button class="qnav-skip" id="skipBtn">건너뛰기 ↩</button>
      <button class="qnav-next" id="nextBtn" disabled>다음 →</button>
    </div>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="end-icon">🏆</div>
    <div class="end-title">완료!</div>
    <div class="end-score" id="endScore">0 / 13</div>
    <div class="end-desc" id="endDesc">두 제품의 조건을 각각 식으로 세우고 연립해서 푸는 게 핵심이에요.</div>
    <button class="retry-btn" onclick="restart()">🔄 다시 도전</button>
  </div>

</div>

<script>
const WP1 = '[문제1] A와 B 두 제품의 가격 합은 <b>50,000원</b>이다. A를 <b>10%</b> 할인하고 B를 <b>20%</b> 할인했더니 전체적으로 <b>15%</b> 할인된 가격이 되었다. A, B 각각의 가격은?';
const WP2 = '[문제2] A 제품은 원가의 <b>30%</b>를 이익으로 붙여 팔고, B 제품은 원가의 <b>20%</b>를 이익으로 붙여 판다. 두 제품의 판매가 합계는 <b>33,000원</b>이고, 이익의 합계는 <b>7,000원</b>이다. A와 B의 원가는 각각 얼마인가?';
const WP3 = '[문제3] 민준이가 원가가 <b>800원</b>인 A 제품과 원가가 <b>1,200원</b>인 B 제품을 합하여 <b>20개</b> 구입한 다음, A는 원가의 <b>25%</b> 이익을, B는 원가의 <b>15%</b> 이익을 붙여 전부 판매했더니 이익이 <b>3,840원</b>이었다. A와 B는 각각 몇 개씩 구입했는가?';

const QUESTIONS = [
{
  topic: '1번 1단계', source: WP1,
  sentence: '미지수를 무엇으로 두면 좋을까?',
  choices: ['A의 가격 x(원), B의 가격 y(원)', '할인율을 x, y로 각각 둔다', '전체 가격을 x, 할인액을 y로 둔다', 'A만 x로 두고 B는 (x−일정값)로 둔다'],
  answer: 0,
  why: '구하는 값이 A, B 각각의 가격이므로 두 미지수 x, y로 둬요.'
},
{
  topic: '1번 2단계', source: WP1,
  sentence: '"가격 합은 50,000원"을 식으로 나타내면?',
  choices: ['x + y = 50000', 'x − y = 50000', 'x × y = 50000', 'x + y = 500'],
  answer: 0,
  why: '두 제품 가격의 합이 50,000원이라는 조건을 그대로 식으로 옮겨요.'
},
{
  topic: '1번 3단계', source: WP1,
  sentence: '"전체적으로 15% 할인된 가격"이 뜻하는 할인 금액은?',
  choices: ['50000 × 0.15 = 7,500원', '50000 × 0.85 = 42,500원', '50000 − 15 = 49,985원', '50000 × 0.015 = 750원'],
  answer: 0,
  why: '전체 15% 할인이란, 원래 가격(50,000원)의 15%만큼 할인됐다는 뜻이에요.'
},
{
  topic: '1번 4단계', source: WP1,
  sentence: '"A는 10% 할인, B는 20% 할인, 합쳐서 전체 할인액 7,500원"을 식으로 나타내면?',
  choices: ['0.1x + 0.2y = 7500', '0.9x + 0.8y = 7500', '0.2x + 0.1y = 7500', '0.1x + 0.2y = 15000'],
  answer: 0,
  why: 'A의 할인액(0.1x)과 B의 할인액(0.2y)을 더하면 전체 할인액(7,500원)과 같아요. 두 식을 연립하면 x=25000, y=25000.'
},
{
  topic: '2번 1단계', source: WP2,
  sentence: '미지수를 무엇으로 두면 좋을까?',
  choices: ['A의 원가 x(원), B의 원가 y(원)', 'A의 판매가 x, B의 판매가 y', '이익률을 x, y로 둔다', 'A만 x로 두고 B는 (x−일정값)로 둔다'],
  answer: 0,
  why: '구하는 값이 A, B 각각의 원가이므로 두 미지수 x, y로 둬요.'
},
{
  topic: '2번 2단계', source: WP2,
  sentence: 'A, B의 판매가를 각각 식으로 나타내면?',
  choices: ['A 판매가 = 1.3x, B 판매가 = 1.2y', 'A 판매가 = 0.3x, B 판매가 = 0.2y', 'A 판매가 = 1.3x, B 판매가 = 0.8y', 'A 판매가 = x+30, B 판매가 = y+20'],
  answer: 0,
  why: '원가에 이익률을 더한 배수를 곱하면 판매가가 나와요. A는 원가의 130%(1.3배), B는 원가의 120%(1.2배)예요.'
},
{
  topic: '2번 3단계', source: WP2,
  sentence: '"판매가 합계 33,000원"을 식으로 나타내면?',
  choices: ['1.3x + 1.2y = 33000', '0.3x + 0.2y = 33000', '1.3x + 1.2y = 3300', 'x + y = 33000'],
  answer: 0,
  why: '두 제품의 판매가(1.3x, 1.2y)를 더하면 판매가 합계(33,000원)와 같아요.'
},
{
  topic: '2번 4단계', source: WP2,
  sentence: 'A, B의 이익을 각각 식으로 나타내면?',
  choices: ['A 이익 = 0.3x, B 이익 = 0.2y', 'A 이익 = 1.3x, B 이익 = 1.2y', 'A 이익 = 0.3x, B 이익 = 0.8y', 'A 이익 = x×30, B 이익 = y×20'],
  answer: 0,
  why: '이익은 원가에 이익률만 곱한 값이에요. A는 원가의 30%(0.3x), B는 원가의 20%(0.2y)예요.'
},
{
  topic: '2번 5단계', source: WP2,
  sentence: '"이익 합계 7,000원"을 식으로 나타내면?',
  choices: ['0.3x + 0.2y = 7000', '1.3x + 1.2y = 7000', '0.3x + 0.2y = 700', 'x + y = 7000'],
  answer: 0,
  why: '두 제품의 이익(0.3x, 0.2y)을 더하면 이익 합계(7,000원)와 같아요. 이 두 식을 연립하면 x=18000, y=8000.'
},
{
  topic: '3번 1단계', source: WP3,
  sentence: '미지수를 무엇으로 두면 좋을까?',
  choices: ['A 제품 개수 x(개), B 제품 개수 y(개)','A 제품 가격 x, B 제품 가격 y','이익률을 x, y로 둔다','A만 x로 두고 B는 (x−일정값)로 둔다'],
  answer: 0, why: '구하는 값이 A, B 각각의 구입 개수이므로 두 미지수 x, y로 둬요.'
},
{
  topic: '3번 2단계', source: WP3,
  sentence: '"합하여 20개 구입"을 식으로 나타내면?',
  choices: ['x + y = 20','x − y = 20','x × y = 20','x + y = 3840'],
  answer: 0, why: 'A와 B 개수의 합이 20개라는 조건을 그대로 옮겨요.'
},
{
  topic: '3번 3단계', source: WP3,
  sentence: 'A, B 제품 1개당 이익을 각각 식으로 나타내면?',
  choices: ['A=800×0.25=200원, B=1200×0.15=180원','A=800×0.75=600원, B=1200×0.85=1020원','A=200x원, B=180y원','A=800+0.25원, B=1200+0.15원'],
  answer: 0, why: '1개당 이익 = 원가 × 이익률이에요. A는 800×0.25=200원, B는 1200×0.15=180원.'
},
{
  topic: '3번 4단계', source: WP3,
  sentence: '"전체 이익 3,840원"을 식으로 나타내면?',
  choices: ['200x + 180y = 3840','200x + 180y = 20','800x + 1200y = 3840','200x − 180y = 3840'],
  answer: 0, why: 'A 제품 x개의 이익(200x)과 B 제품 y개의 이익(180y)을 더하면 전체 이익(3,840원)이 돼요. 두 식을 연립하면 x=12, y=8.'
}
];

let order = [], idx = 0, score = 0, streak = 0, answered = false;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function restart(){
  order = QUESTIONS.map((_,i)=>i);
  idx = 0; score = 0; streak = 0;
  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('quizCard').style.display = 'block';
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const q = QUESTIONS[order[idx]];
  document.getElementById('quizTopic').textContent = q.topic;
  document.getElementById('quizSource').innerHTML = q.source;
  document.getElementById('quizSentence').textContent = q.sentence;
  document.getElementById('progPill').textContent = (idx+1)+' / '+QUESTIONS.length;
  document.getElementById('totalNum').textContent = idx+' / '+QUESTIONS.length;
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('streakNum').textContent = streak+'🔥';
  document.getElementById('progFill').style.width = (idx/QUESTIONS.length*100)+'%';

  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  const shuffledChoiceIdx = shuffle(q.choices.map((_,i)=>i));
  shuffledChoiceIdx.forEach((origIdx, pos)=>{
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.dataset.idx = origIdx;
    btn.innerHTML = '<span class="choice-num">'+(pos+1)+'</span><span>'+q.choices[origIdx]+'</span>';
    btn.onclick = ()=> selectChoice(origIdx, btn);
    choicesEl.appendChild(btn);
  });

  document.getElementById('explainBox').className = 'explain-box';
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('prevBtn').disabled = (idx === 0);
}

function selectChoice(origIdx, btnEl){
  if(answered) return;
  answered = true;
  const q = QUESTIONS[order[idx]];
  const allBtns = document.querySelectorAll('.choice-btn');
  allBtns.forEach(b=> b.disabled = true);

  const isCorrect = origIdx === q.answer;
  if(isCorrect){
    btnEl.classList.add('correct');
    score++; streak++;
  } else {
    btnEl.classList.add('wrong');
    allBtns.forEach(b=>{
      if(Number(b.dataset.idx) === q.answer) b.classList.add('correct');
    });
    streak = 0;
  }
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('streakNum').textContent = streak+'🔥';

  const box = document.getElementById('explainBox');
  box.className = 'explain-box show ' + (isCorrect ? 'good' : 'bad');
  document.getElementById('explainVerdict').textContent = isCorrect ? '✅ 맞아요!' : '❌ 아쉬워요 — 정답: '+q.choices[q.answer];
  document.getElementById('explainText').textContent = q.why;

  document.getElementById('nextBtn').disabled = false;
}

function goToEnd(){
  document.getElementById('quizCard').style.display = 'none';
  document.getElementById('endScreen').classList.add('show');
  document.getElementById('endScore').textContent = score+' / '+QUESTIONS.length;
  document.getElementById('progFill').style.width = '100%';
  document.getElementById('totalNum').textContent = QUESTIONS.length+' / '+QUESTIONS.length;
  document.getElementById('progPill').textContent = QUESTIONS.length+' / '+QUESTIONS.length;
}

document.getElementById('nextBtn').onclick = ()=>{
  if(document.getElementById('nextBtn').disabled) return;
  idx++;
  if(idx >= QUESTIONS.length){ goToEnd(); } else { renderQuestion(); }
};

document.getElementById('skipBtn').onclick = ()=>{
  idx++;
  if(idx >= QUESTIONS.length){ goToEnd(); } else { renderQuestion(); }
};

document.getElementById('prevBtn').onclick = ()=>{
  if(idx === 0) return;
  idx--;
  renderQuestion();
};

function printQuestions(){
  const rows = QUESTIONS.map((q,i)=>`<div class="p-card">
    <div class="p-meta">${i+1} / ${QUESTIONS.length} · ${q.topic}</div>
    <div class="p-source">${q.source}</div>
    <div class="p-sentence">${q.sentence}</div>
    <ol class="p-choices">${q.choices.map((c,ci)=>`<li${ci===q.answer?' class="correct"':''}>${c}</li>`).join('')}</ol>
    <div class="p-why"><b>풀이</b> ${q.why}</div>
  </div>`).join('');
  const w = window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
  <title>연립방정식의 활용 — 원가정가 — 인쇄</title>
  <style>
    body{font-family:'Nanum Gothic',sans-serif;color:#111;padding:24px;line-height:1.6}
    .p-card{border:1px solid #ccc;border-radius:10px;padding:14px 16px;margin-bottom:16px;page-break-inside:avoid}
    .p-meta{font-size:.75rem;color:#666;margin-bottom:6px}
    .p-source{font-weight:700;margin-bottom:8px;background:#f5f5f5;border-radius:6px;padding:8px}
    .p-sentence{font-weight:700;margin-bottom:8px}
    .p-choices{margin:0 0 8px 20px;padding:0}
    .p-choices li.correct{color:#0a7a3d;font-weight:700}
    .p-why{font-size:.85rem;color:#333;background:#fafafa;border-radius:6px;padding:8px}
  </style></head><body>${rows}</body></html>`);
  w.document.close();
}

restart();
</script>
</body>
</html>
