<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연결 안 됨 — 🦕 수학여행 학원</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0f1923;color:#f0f4f8;font-family:'Nanum Gothic',sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;gap:14px;
}
.ico{font-size:4rem}
h1{font-family:'Jua',sans-serif;font-size:1.4rem}
p{color:#8899aa;font-size:.95rem;line-height:1.7;max-width:320px}
button{
  margin-top:10px;border:none;border-radius:14px;cursor:pointer;font-family:'Jua',sans-serif;
  background:linear-gradient(135deg,#1a5c2a,#2ecc71);color:#fff;padding:12px 28px;font-size:1rem;
}
button:active{transform:scale(.96)}
</style>
</head>
<body>
  <div class="ico">🦕</div>
  <h1>인터넷 연결을 확인해주세요</h1>
  <p>토로가 길을 잃었어요. Wi-Fi나 데이터 연결을 확인한 뒤 다시 시도해 주세요.</p>
  <button onclick="location.reload()">다시 시도</button>
</body>
</html>
